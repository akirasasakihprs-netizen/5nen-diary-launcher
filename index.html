<!--
  5年日記帳帳起動用ランチャーページ（GitHub Pages）
  Version: 1.3
 最終更新: （コミット完了後の実際の日時をここに記入してください）

  変更履歴:
    v1.3（コミット後に日付を記入）: PCで本物の「PWA（Webアプリ）としてインストール」
      できるようにするための変更。manifest.jsonのstart_urlが省略されていたため
      Chromeがインストール可能なアプリと認識していなかったことが判明。対策として、
      (1) manifest.jsonのstart_urlを固定の"index.html"に変更し、scopeも追加、
      (2) 最小限のサービスワーカー（sw.js）を新規追加してこのページから登録、
      (3) このスクリプトで、?sheet=付きURLで訪問した際にそのスプレッドシートIDを
      localStorageに保存しておき、?sheet=が付いていない状態で起動された場合
      （＝インストール済みアプリのアイコンから起動した場合）は保存済みのIDを
      読み込んで使うように変更。これにより、manifest.jsonは全ユーザー共通の
      固定ファイルのままで、各ユーザーは自分のスプレッドシートへ辿り着ける。
      ※Chromeが実際にインストールを提案してくるようになるかは未検証。
    v1.2（コミット後に日付を記入）: v1.1をGitHubに反映した際、ファイルの先頭に
      誤って余分なテキスト（「/」の行と空白行、および「Index v8 manifest ・ TXT」
      という文字列）が紛れ込んでしまい、ページ上部に意図しない表示が出てしまって
      いた不具合を修正。内容そのもの（manifest.json連携など）はv1.1から変更なし。
    v1.1（コミット後に日付を記入）: PCでこのページを「アプリとしてインストール」
      できるようにするため、Webアプリマニフェスト（manifest.json）への
      リンクを追加。同じリポジトリにicon-192.png・icon-512.png（専用アイコン
      画像）・manifest.jsonの3ファイルを新規追加する必要がある。
      ※ブックマークバーの専用アイコンが時々標準のGoogleスプレッドシート
      アイコンに戻ってしまう現象の対策として、「ブックマーク」ではなく
      「インストールされたアプリ」という別の仕組みを使うことで回避できるか
      試している段階。効果は未検証。
    v1.0 (2026-09-06): 初回リリースとしてバージョン管理を開始。
      - 自動遷移（ボタンなしで日記帳へ直接移動、2回目以降）
      - 端末別の初回案内（PC/Android/iOS）をlocalStorageで初回のみ表示
      - iOS向けはショートカットアプリでの直接起動を推奨し、URLコピー機能を追加
    (このバージョン以前の変更履歴は、Coworkプロジェクトドキュメント
     「v0.80.8_セットアップ完了ダイアログ_GitHub Pagesランチャー導線追加」を参照)
 
  今後この行を編集する際は、
    1. Versionを必ず1つ上げる（同じ番号を使い回さない）
    2. 最終更新には、実際にGitHubへコミットが完了した後の日時を記入する（予測時刻は書かない）
    3. 変更履歴に、変更内容を1行で追記する

<body>
<h2>5年日記帳</h2>
<div id="content">
  <p>読み込み中...</p>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var sheetId = params.get("sheet");
  var content = document.getElementById("content");

  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }

  var SAVED_SHEET_KEY = "savedSheetId";
  if (sheetId) {
    try { localStorage.setItem(SAVED_SHEET_KEY, sheetId); } catch (e) {}
  } else {
    try { sheetId = localStorage.getItem(SAVED_SHEET_KEY) || ""; } catch (e) { sheetId = ""; }
  }

  if (!sheetId) {
    content.innerHTML =
      "<p class=\"err\">起動用リンクにご自身のスプレッドシートIDが含まれていないようです。<br>取扱説明書に記載の正しいリンクをお使いください。</p>";
    return;
  }
  var url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/edit";
  var storageKey = "diaryGuideSeen_" + sheetId;
  var alreadySeen = false;
  try { alreadySeen = localStorage.getItem(storageKey) === "1"; } catch (e) {}
 
  if (alreadySeen) {
    content.innerHTML = "<p>日記帳を開いています...</p>";
    window.location.href = url;
    return;
  }
 
  var ua = navigator.userAgent;
  var isIOS = /iP(hone|od|ad)/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
 
  var guideHtml;
  if (isIOS) {
    guideHtml =
      "<div class=\"guide\"><b>iPhone/iPadをお使いの方（おすすめの方法）</b><br>" +
      "下のボタンで日記帳のURLをコピーし、「ショートカット」アプリで新しいショートカットを作り、" +
      "アクション「URLを開く」にこのURLを貼り付けてホーム画面に追加してください。" +
      "この方法だと、ログイン画面やGoogleの案内が出ず、日記帳の画面だけがすぐに開きます。<br>" +
      "<button type=\"button\" id=\"copyUrlBtn\" style=\"margin-top:10px;padding:8px 16px;font-size:14px;border-radius:6px;border:1px solid #0B8043;background:#fff;color:#0B8043;\">" +
      "日記帳のURLをコピー</button> " +
      "<span id=\"copyStatus\" style=\"font-size:12px;color:#0B8043;\"></span>" +
      "<details style=\"margin-top:10px;\"><summary style=\"cursor:pointer;\">ショートカットの作り方（詳しく）</summary>" +
      "<div style=\"margin-top:8px;font-size:13px;\">" +
      "①「ショートカット」アプリを開く<br>" +
      "② 右上の「＋」で新規ショートカットを作成<br>" +
      "③「アクションを追加」→「URLを開く」を選ぶ<br>" +
      "④ URL欄に、コピーしたURLを貼り付ける<br>" +
      "⑤ 名前を付けて、共有ボタン→「ホーム画面に追加」で登録する" +
      "</div></details>" +
      "<p style=\"margin-top:10px;font-size:12px;color:#8a8a70;\">" +
      "（簡単な方法として、この画面をそのままホーム画面に追加することもできますが、まれにログイン画面が表示されることがあります）</p></div>";
  } else if (isAndroid) {
    guideHtml =
      "<div class=\"guide\"><b>Androidをお使いの方</b><br>" +
      "画面右上の「︙」メニューを開き、「ホーム画面に追加」を選んでください。<br>" +
      "次回からアイコンをタップするだけで、この日記帳へ直接移動します。</div>";
  } else {
    guideHtml =
      "<div class=\"guide\"><b>パソコンをお使いの方</b><br>" +
      "<b>Ctrl+D</b>（Macは<b>⌘+D</b>）を押してブックマーク登録してください。<br>" +
      "次回からそのブックマークを開くだけで、この日記帳へ直接移動します。" +
      "<br><span style=\"font-size:12px;color:#8a8a70;\">" +
      "（このアプリ専用のアイコンは、反映に少し時間がかかる場合があります）</span></div>";
  }
 
  content.innerHTML =
    "<p><b>①</b> まず、下の案内に沿ってブックマーク／ホーム画面への登録をしてください。</p>" +
    guideHtml +
    "<p style=\"margin-top:20px;\"><b>②</b> 登録が終わったら、下のボタンで日記帳を開いてください。</p>" +
    "<p><a class=\"btn\" href=\"" + url + "\" target=\"_top\" id=\"openBtn\">日記帳を開く</a></p>";
 
  document.getElementById("openBtn").addEventListener("click", function () {
    try { localStorage.setItem(storageKey, "1"); } catch (e) {}
  });
 
  if (isIOS) {
    var copyBtn = document.getElementById("copyUrlBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var status = document.getElementById("copyStatus");
        function showCopied() {
          if (status) { status.textContent = "コピーしました"; }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(showCopied).catch(function () {
            if (status) { status.textContent = "コピーできませんでした。下のURLを長押しでコピーしてください：" + url; }
          });
        } else {
          if (status) { status.textContent = url; }
        }
      });
    }
  }
})();
</script>
</body>
</html>
