<title>埋め込みテスト</title>
<style>
  :root{
    --bg:#f5f5f0;
    --fg:#2b2b26;
    --muted:#6b6b62;
    --accent:#0B8043;
    --frame-border:#d8d6cc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1c18;
      --fg:#eae8df;
      --muted:#a3a196;
      --frame-border:#3a3a33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1c18;
    --fg:#eae8df;
    --muted:#a3a196;
    --frame-border:#3a3a33;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex;
    flex-direction:column;
    padding:12px 16px;
    gap:10px;
    min-height:100vh;
  }
  h1{font-size:15px;margin:0;font-weight:600}
  p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
  .frame-wrap{
    flex:1;
    border:1px solid var(--frame-border);
    border-radius:8px;
    overflow:hidden;
    min-height:300px;
    background:#fff;
  }
  iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
</style>
<h1>Google Sheets 埋め込みテスト（rm=embedded）</h1>
<p>下の枠内にスプレッドシートの中身が表示されれば埋め込み成功、白紙・エラー表示なら埋め込みはブロックされています。</p>
<div class="frame-wrap">
  <iframe src="https://docs.google.com/spreadsheets/d/1ZmtmMHYZKdgF9G0k5n-8QAosvCWdymkzDk3Zyrrdjqo/edit?rm=embedded" loading="eager"></iframe>
</div>
